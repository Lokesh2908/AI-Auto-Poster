spring:
  application:
    name: ai-auto-poster
  
  datasource:
    url: jdbc:mysql://localhost:3306/testdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Test#123
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
        
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mySecretKey}
  expiration: 86400000

ai:
  openai:
    apiKey: YOUR_API_KEY_HERE
    url: API_URL
  azure:
    apiKey: 21ca2ad4962e432191b93a12ccf14adb
    url: https://devaianakage.openai.azure.com/openai/deployments/Gpt-internal/chat/completions?api-version=2025-01-01-preview

linkedin:
  client:
    id: ${LINKEDIN_CLIENT_ID:your-linkedin-client-id}
    secret: ${LINKEDIN_CLIENT_SECRET:your-linkedin-client-secret}
    redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/auth/linkedin/callback}

logging:
  level:
    com.aiautoposter: DEBUG
    org.springframework.security: DEBUG
