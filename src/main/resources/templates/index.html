<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto Poster - Revolutionary Content Management</title>
    <script src="/js/media.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'gradient-y': 'gradient-y 15s ease infinite',
                        'gradient-xy': 'gradient-xy 15s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slow': 'bounce 3s infinite',
                        'wiggle': 'wiggle 1s ease-in-out infinite',
                    },
                    keyframes: {
                        'gradient-y': {
                            '0%, 100%': {
                                'background-size': '400% 400%',
                                'background-position': 'center top'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'center center'
                            }
                        },
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            }
                        },
                        'gradient-xy': {
                            '0%, 100%': {
                                'background-size': '400% 400%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            }
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' }
                        },
                        'wiggle': {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .bg-gradient-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .bg-gradient-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .bg-gradient-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .bg-gradient-warning {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .bg-gradient-danger {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        
        .bg-gradient-dark {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }
        
        .bg-gradient-rainbow {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7, #dda0dd, #98d8c8);
            background-size: 400% 400%;
            animation: gradient-xy 15s ease infinite;
        }
        
        .text-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% 200%;
            animation: gradient-x 3s ease infinite;
        }
        
        .text-gradient-rainbow {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 400% 400%;
            animation: gradient-x 5s ease infinite;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glass-dark {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        
        .card:hover {
            transform: translateY(-8px) rotateX(5deg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .card-glow {
            position: relative;
            overflow: hidden;
        }
        
        .card-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .card-glow:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }
        
        .shape:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { top: 60%; left: 80%; animation-delay: 2s; }
        .shape:nth-child(3) { top: 80%; left: 20%; animation-delay: 4s; }
        .shape:nth-child(4) { top: 40%; left: 60%; animation-delay: 1s; }
        .shape:nth-child(5) { top: 10%; left: 70%; animation-delay: 3s; }
        
        .tab-indicator {
            position: absolute;
            bottom: 0;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2px 2px 0 0;
        }
        
        .notification-badge {
            animation: pulse 2s infinite;
        }
        
        .status-badge {
            position: relative;
            overflow: hidden;
        }
        
        .status-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.8s;
        }
        
        .status-badge:hover::before {
            left: 100%;
        }
        
        .modal-backdrop {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.5);
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1), 0 0 20px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        
        .chart-container {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .card:hover {
                transform: translateY(-4px);
            }
        }
        
        .loading-spinner {
            border: 3px solid rgba(102, 126, 234, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hero-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradient-xy 15s ease infinite;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .feature-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen transition-colors duration-300">
    <div id="app" x-data="appData()">
        <!-- Navigation -->
        <div th:replace="fragments/header :: header"></div>

        <!-- Floating Background Shapes -->
        <div class="floating-shapes">
            <div class="shape w-64 h-64 bg-gradient-primary rounded-full"></div>
            <div class="shape w-48 h-48 bg-gradient-secondary rounded-full"></div>
            <div class="shape w-32 h-32 bg-gradient-success rounded-full"></div>
            <div class="shape w-56 h-56 bg-gradient-warning rounded-full"></div>
            <div class="shape w-40 h-40 bg-gradient-danger rounded-full"></div>
        </div>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto py-6 px-4 relative z-10">
            <template x-if="!isAuthenticated">
                <!-- Hero Section -->
                <div id="hero" class="hero-bg text-center py-20 px-8 rounded-3xl mb-12 relative overflow-hidden">
                    <div class="relative z-10">
                        <div class="animate-float">
                            <i class="fas fa-robot text-6xl text-white mb-8 animate-bounce-slow"></i>
                        </div>
                        <h1 class="hero-title text-5xl md:text-7xl font-black text-white mb-6 leading-tight">
                            AI <span class="text-gradient-rainbow">Auto Poster</span>
                        </h1>
                        <p class="hero-subtitle text-xl md:text-2xl text-white/90 mb-8 max-w-3xl mx-auto leading-relaxed">
                            🚀 Revolutionary AI-powered content generation and LinkedIn posting with intelligent approval workflows
                        </p>
                        <div class="space-x-4 mb-12">
                            <button @click="showLogin = true" class="hero-cta btn-primary text-white px-8 py-4 rounded-2xl text-lg font-semibold shadow-2xl">
                                <i class="fas fa-rocket mr-2"></i>
                                Get Started
                            </button>
                            <button @click="showRegister = true" class="glass text-white px-8 py-4 rounded-2xl text-lg font-semibold border-2 border-white/30 hover:bg-white/20">
                                <i class="fas fa-user-plus mr-2"></i>
                                Join Now
                            </button>
                        </div>
                        
                        <!-- Feature Cards -->
                        <div class="grid md:grid-cols-3 gap-6 mt-16">
                            <div class="feature-card rounded-2xl p-6 text-left">
                                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mb-4">
                                    <i class="fas fa-brain text-white text-xl"></i>
                                </div>
                                <h3 class="text-xl font-bold text-white mb-2">AI Content Generation</h3>
                                <p class="text-white/80">Advanced AI creates engaging LinkedIn posts from your discussions</p>
                            </div>
                            <div class="feature-card rounded-2xl p-6 text-left">
                                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mb-4">
                                    <i class="fas fa-users text-white text-xl"></i>
                                </div>
                                <h3 class="text-xl font-bold text-white mb-2">Smart Approval Workflow</h3>
                                <p class="text-white/80">Streamlined manager approval system with real-time notifications</p>
                            </div>
                            <div class="feature-card rounded-2xl p-6 text-left">
                                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mb-4">
                                    <i class="fas fa-calendar-alt text-white text-xl"></i>
                                </div>
                                <h3 class="text-xl font-bold text-white mb-2">Intelligent Scheduling</h3>
                                <p class="text-white/80">Schedule posts for optimal engagement times automatically</p>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="isAuthenticated">
                <div>
                    <!-- Dashboard Tabs -->
                    <div class="mb-8 glass rounded-2xl p-2 backdrop-blur-xl">
                        <nav class="flex space-x-2 relative">
                            <button @click="activeTab = 'dashboard'" 
                                    :class="activeTab === 'dashboard' ? 'bg-gradient-primary text-white shadow-lg' : 'text-gray-600 hover:text-gray-800'"
                                    class="relative px-6 py-3 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center space-x-2">
                                <i class="fas fa-chart-pie"></i>
                                <span>Dashboard</span>
                                <span x-show="activeTab === 'dashboard'" class="absolute -top-1 -right-1 w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></span>
                            </button>
                            <button @click="activeTab = 'posts'" 
                                    :class="activeTab === 'posts' ? 'bg-gradient-primary text-white shadow-lg' : 'text-gray-600 hover:text-gray-800'"
                                    class="relative px-6 py-3 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center space-x-2">
                                <i class="fas fa-file-alt"></i>
                                <span>Posts</span>
                                <span x-show="posts.length > 0" class="ml-2 bg-blue-500 text-white text-xs px-2 py-1 rounded-full" x-text="posts.length"></span>
                            </button>
                            <button @click="activeTab = 'approvals'" 
                                    :class="activeTab === 'approvals' ? 'bg-gradient-primary text-white shadow-lg' : 'text-gray-600 hover:text-gray-800'"
                                    class="relative px-6 py-3 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center space-x-2">
                                <i class="fas fa-check-circle"></i>
                                <span>Approvals</span>
                                <span x-show="pendingApprovals.length > 0" class="ml-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full notification-badge" x-text="pendingApprovals.length"></span>
                            </button>
                            <button @click="activeTab = 'schedule'" 
                                    :class="activeTab === 'schedule' ? 'bg-gradient-primary text-white shadow-lg' : 'text-gray-600 hover:text-gray-800'"
                                    class="relative px-6 py-3 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center space-x-2">
                                <i class="fas fa-calendar-alt"></i>
                                <span>Schedule</span>
                            </button>
                            <button @click="activeTab = 'notifications'" 
                                    :class="activeTab === 'notifications' ? 'bg-gradient-primary text-white shadow-lg' : 'text-gray-600 hover:text-gray-800'"
                                    class="relative px-6 py-3 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center space-x-2">
                                <i class="fas fa-bell"></i>
                                <span>Notifications</span>
                                <span x-show="notifications.filter(n => !n.readStatus).length > 0" class="ml-2 bg-orange-500 text-white text-xs px-2 py-1 rounded-full notification-badge" x-text="notifications.filter(n => !n.readStatus).length"></span>
                            </button>
                            <button @click="activeTab = 'media'"
                                    :class="activeTab === 'media' ? 'bg-gradient-primary text-white shadow-lg' : 'text-gray-600 hover:text-gray-800'"
                                    class="relative px-6 py-3 rounded-xl font-semibold text-sm transition-all duration-300 flex items-center space-x-2">
                                <i class="fas fa-images"></i>
                                <span>Media Gallery</span>
                                <span x-show="mediaList.length > 0" class="ml-2 bg-green-500 text-white text-xs px-2 py-1 rounded-full" x-text="mediaList.length"></span>
                            </button>
                        </nav>
                    </div>

                    <!-- Dashboard Content -->
                    <div x-show="activeTab === 'dashboard'" data-tab="dashboard">
                        <!-- Welcome Banner -->
                        <div class="bg-gradient-primary rounded-3xl p-8 mb-8 text-white relative overflow-hidden">
                            <div class="relative z-10">
                                <h2 class="text-3xl font-bold mb-2">Welcome back! 👋</h2>
                                <p class="text-white/90 text-lg">Ready to create amazing content today?</p>
                            </div>
                            <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-16 -mt-16"></div>
                            <div class="absolute bottom-0 left-0 w-24 h-24 bg-white/10 rounded-full -ml-12 -mb-12"></div>
                        </div>

                        <!-- Stats Cards -->
                        <div class="stats-grid mb-8">
                            <div class="card card-glow bg-gradient-to-br from-blue-500 to-blue-600 p-8 rounded-3xl text-white relative overflow-hidden">
                                <div class="relative z-10">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="p-3 bg-white/20 rounded-2xl">
                                            <i class="fas fa-file-alt text-2xl"></i>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-blue-100 text-sm font-medium">Total Posts</p>
                                            <p class="stat-count text-4xl font-black" x-text="stats.totalPosts || 0"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center text-blue-100">
                                        <i class="fas fa-arrow-up text-green-300 mr-1"></i>
                                        <span class="text-sm">+12% from last month</span>
                                    </div>
                                </div>
                                <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full"></div>
                            </div>

                            <div class="card card-glow bg-gradient-to-br from-orange-500 to-red-500 p-8 rounded-3xl text-white relative overflow-hidden">
                                <div class="relative z-10">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="p-3 bg-white/20 rounded-2xl">
                                            <i class="fas fa-clock text-2xl"></i>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-orange-100 text-sm font-medium">Pending Approvals</p>
                                            <p class="stat-count text-4xl font-black" x-text="stats.pendingApprovals || 0"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center text-orange-100">
                                        <i class="fas fa-exclamation-triangle text-yellow-300 mr-1"></i>
                                        <span class="text-sm">Needs attention</span>
                                    </div>
                                </div>
                                <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full"></div>
                            </div>

                            <div class="card card-glow bg-gradient-to-br from-green-500 to-emerald-600 p-8 rounded-3xl text-white relative overflow-hidden">
                                <div class="relative z-10">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="p-3 bg-white/20 rounded-2xl">
                                            <i class="fas fa-check-circle text-2xl"></i>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-green-100 text-sm font-medium">Published</p>
                                            <p class="stat-count text-4xl font-black" x-text="stats.publishedPosts || 0"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center text-green-100">
                                        <i class="fas fa-rocket text-yellow-300 mr-1"></i>
                                        <span class="text-sm">Great job!</span>
                                    </div>
                                </div>
                                <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full"></div>
                            </div>

                            <div class="card card-glow bg-gradient-to-br from-purple-500 to-pink-500 p-8 rounded-3xl text-white relative overflow-hidden">
                                <div class="relative z-10">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="p-3 bg-white/20 rounded-2xl">
                                            <i class="fas fa-eye text-2xl"></i>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-purple-100 text-sm font-medium">Total Views</p>
                                            <p class="stat-count text-4xl font-black">2.4K</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center text-purple-100">
                                        <i class="fas fa-arrow-up text-green-300 mr-1"></i>
                                        <span class="text-sm">+24% engagement</span>
                                    </div>
                                </div>
                                <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full"></div>
                            </div>

                            <div class="card card-glow bg-gradient-to-br from-indigo-500 to-blue-600 p-8 rounded-3xl text-white relative overflow-hidden">
                                <div class="relative z-10">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="p-3 bg-white/20 rounded-2xl">
                                            <i class="fas fa-calendar-check text-2xl"></i>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-indigo-100 text-sm font-medium">Scheduled</p>
                                            <p class="stat-count text-4xl font-black" x-text="scheduledPosts.length || 0"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center text-indigo-100">
                                        <i class="fas fa-clock text-yellow-300 mr-1"></i>
                                        <span class="text-sm">Ready to go</span>
                                    </div>
                                </div>
                                <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full"></div>
                            </div>

                            <div class="card card-glow bg-gradient-to-br from-teal-500 to-cyan-600 p-8 rounded-3xl text-white relative overflow-hidden">
                                <div class="relative z-10">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="p-3 bg-white/20 rounded-2xl">
                                            <i class="fas fa-thumbs-up text-2xl"></i>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-teal-100 text-sm font-medium">Engagement Rate</p>
                                            <p class="stat-count text-4xl font-black">8.2%</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center text-teal-100">
                                        <i class="fas fa-arrow-up text-green-300 mr-1"></i>
                                        <span class="text-sm">Above average</span>
                                    </div>
                                </div>
                                <div class="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full"></div>
                            </div>
                        </div>

                        <!-- Recent Posts -->
                        <div class="bg-white rounded-lg shadow">
                            <div class="px-6 py-4 border-b border-gray-200">
                                <h3 class="text-lg font-medium text-gray-900">Recent Posts</h3>
                            </div>
                            <div class="p-6">
                                <div class="space-y-4">
                                    <template x-for="post in recentPosts" :key="post.id">
                                        <div class="card flex items-center justify-between p-4 border border-gray-200 rounded-lg">

                        <div class="flex justify-end space-x-3">
                            <button type="button" @click="closeUploadModal()"
                                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                                Cancel
                            </button>
                            <button type="submit" :disabled="isUploading"
                                    class="px-6 py-2 text-sm font-medium text-white bg-gradient-success rounded-lg hover:shadow-lg transition-all flex items-center">
                        <span x-show="!isUploading">
                            <i class="fas fa-upload mr-2"></i>
                            Upload
                        </span>
                                <span x-show="isUploading" class="flex items-center">
                            <div class="loading-spinner mr-2"></div>
                            Uploading...
                        </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script>

        function connectLinkedIn() {
            const token = localStorage.getItem('token'); // Your JWT token

            if (!token) {
                alert('Please login first');
                return;
            }

            // Get LinkedIn auth URL
            fetch('/api/linkedin/auth-url', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.authUrl) {
                    // Open LinkedIn auth in popup
                    const popup = window.open(data.authUrl, 'linkedin-auth',
                        'width=600,height=700,scrollbars=yes,resizable=yes');

                    // Check for popup completion
                    const checkClosed = setInterval(() => {
                        if (popup.closed) {
                            clearInterval(checkClosed);
                            // Refresh LinkedIn status
                            checkLinkedInStatus();
                        }
                    }, 1000);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function checkLinkedInStatus() {
            const token = localStorage.getItem('token');

            fetch('/api/linkedin/status', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                const button = document.getElementById('linkedin-connect-btn');
                if (data.connected) {
                    button.innerHTML = `✅ Connected as ${data.name}`;
                    button.onclick = disconnectLinkedIn;
                } else {
                    button.innerHTML = '🔗 Connect LinkedIn';
                    button.onclick = connectLinkedIn;
                }
            });
        }

        function disconnectLinkedIn() {
            const token = localStorage.getItem('token');

            fetch('/api/linkedin/disconnect', {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message || data.error);
                checkLinkedInStatus();
            });
        }

         function postOnLinkedIn() {
            const token = localStorage.getItem('token');

            fetch('/api/linkedin/publish-post/6', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message || data.error);
                checkLinkedInStatus();
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', checkLinkedInStatus);


        function appData() {
            return {
                isDark: false,
                isAuthenticated: false,
                user: null,
                token: localStorage.getItem('token'),
                activeTab: 'dashboard',
                postFilter: 'all',
                showLogin: false,
                showRegister: false,
                showCreatePost: false,
                showScheduleModal: false,
                showRejectModal: false,
                stats: {
                    totalPosts: 0,
                    pendingApprovals: 0,
                    publishedPosts: 0
                },
                posts: [],
                recentPosts: [],
                filteredPosts: [],
                pendingApprovals: [],
                scheduledPosts: [],
                notifications: [],
                loginForm: {
                    email: '',
                    password: ''
                },
                registerForm: {
                    email: '',
                    password: '',
                    department: '',
                    role: 'USER'
                },
                postForm: {
                    title: '',
                    sourceDiscussion: '',
                    targetPlatforms: 'linkedin'
                },
                selectedApproval: null,
                rejectFeedback: '',

                //media vars
                mediaList: [],
                showGenerateImage: false,
                showUploadImage: false,
                isGenerating: false,
                isUploading: false,
                uploadPreview: null,
                selectedFile: null,
                generateForm: { prompt: '', title: '' },
                uploadForm: { title: '', description: '' },

                init() {
                    document.documentElement.classList.remove('dark');
                    if (this.token) {
                        this.validateToken();
                    } else {
                        // Show login modal if no token
                        this.showLogin = true;
                    }
                    this.animateIn();
                },

                toggleDarkMode() {},

                animateIn() {
                    try {
                        if (window.anime) {
                            // Cards entrance
                            anime({
                                targets: '.card',
                                translateY: [16, 0],
                                opacity: [0, 1],
                                easing: 'spring(1, 80, 10, 0)',
                                delay: anime.stagger(60)
                            });
                            // Hero timeline
                            anime.timeline({ easing: 'easeOutExpo' })
                                .add({ targets: '.hero-title', translateY: [20, 0], opacity: [0, 1], duration: 600 })
                                .add({ targets: '.hero-subtitle', translateY: [12, 0], opacity: [0, 1], duration: 500 }, '-=300')
                                .add({ targets: '.hero-cta', scale: [0.96, 1], opacity: [0, 1], duration: 400 }, '-=300');

                            // Stat count-up animation
                            const nums = document.querySelectorAll('.stat-count');
                            nums.forEach(function(el) {
                                const end = Number(el.textContent || '0');
                                el.textContent = '0';
                                anime({
                                    targets: el,
                                    innerHTML: [0, end],
                                    easing: 'easeOutCubic',
                                    round: 1,
                                    duration: 900
                                });
                            });

                            // Tab transition animation handler
                            const animateTab = function(tab) {
                                anime({
                                    targets: `[data-tab="${tab}"] .card, [data-tab="${tab}"] .list-item`,
                                    translateY: [12, 0],
                                    opacity: [0, 1],
                                    easing: 'easeOutCubic',
                                    delay: anime.stagger(40)
                                });
                            };
                            this.$watch('activeTab', function(tab) { animateTab(tab); });
                        }
                    } catch(e) {}
                },

                async validateToken() {
                    try {
                        const response = await fetch('/api/auth/validate', {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            this.isAuthenticated = true;
                            this.user = data.user;
                            this.loadData();
                        } else {
                            this.logout();
                        }
                    } catch (error) {
                        console.error('Token validation failed:', error);
                        this.logout();
                    }
                },

                async loadUserData() {
                    // This method is now handled in validateToken
                    // Keep for backward compatibility
                },

                async loadData() {
                    if (!this.isAuthenticated) return;
                    
                    await Promise.all([
                        this.loadPosts(),
                        this.loadApprovals(),
                        this.loadSchedules(),
                        this.loadNotifications(),
                        this.loadStats(),
                        this.loadMedia()
                    ]);
                },

               // ADD THESE METHODS alongside your existing ones:

                async loadMedia() {
                    try {
                        const response = await fetch('/api/media', {
                            headers: { 'Authorization': 'Bearer ' + this.token }
                        });
                        if (response.ok) {
                            this.mediaList = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load media:', error);
                    }
                },

                async generateImage() {
                    this.isGenerating = true;
                    try {
                        const formData = new FormData();
                        formData.append('prompt', this.generateForm.prompt);
                        formData.append('title', this.generateForm.title || 'AI Generated Image');

                        const response = await fetch('/api/media/generate-image', {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + this.token },
                            body: formData
                        });

                        if (response.ok) {
                            this.showGenerateImage = false;
                            this.generateForm = { prompt: '', title: '' };
                            await this.loadMedia();
                            alert('Image generated successfully!');
                        } else {
                            const error = await response.text();
                            alert('Generation failed: ' + error);
                        }
                    } catch (error) {
                        alert('Generation failed: ' + error.message);
                    } finally {
                        this.isGenerating = false;
                    }
                },

                handleFileSelect(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.selectedFile = file;
                        const reader = new FileReader();
                        reader.onload = (e) => { this.uploadPreview = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                },

                async uploadImage() {
                    if (!this.selectedFile) {
                        alert('Please select a file');
                        return;
                    }

                    this.isUploading = true;
                    try {
                        const formData = new FormData();
                        formData.append('file', this.selectedFile);
                        formData.append('title', this.uploadForm.title);
                        formData.append('description', this.uploadForm.description);

                        const response = await fetch('/api/media/upload', {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + this.token },
                            body: formData
                        });

                        if (response.ok) {
                            this.closeUploadModal();
                            await this.loadMedia();
                            alert('Image uploaded successfully!');
                        } else {
                            const error = await response.text();
                            alert('Upload failed: ' + error);
                        }
                    } catch (error) {
                        alert('Upload failed: ' + error.message);
                    } finally {
                        this.isUploading = false;
                    }
                },

                async deleteMedia(mediaId) {
                    if (!confirm('Are you sure you want to delete this media?')) {
                        return;
                    }

                    try {
                        const response = await fetch(`/api/media/${mediaId}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': 'Bearer ' + this.token }
                        });

                        if (response.ok) {
                            await this.loadMedia(); // Refresh the media list
                            alert('Media deleted successfully!');
                        } else {
                            const error = await response.text();
                            alert('Delete failed: ' + error);
                        }
                    } catch (error) {
                        console.error('Delete media error:', error);
                        alert('Delete failed: ' + error.message);
                    }
                },


                closeUploadModal() {
                    this.showUploadImage = false;
                    this.uploadForm = { title: '', description: '' };
                    this.uploadPreview = null;
                    this.selectedFile = null;
                },

                copyImageUrl(url) {
                    navigator.clipboard.writeText(url).then(() => {
                        alert('Image URL copied to clipboard!');
                    });
                },

                formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                },

                async loadPosts() {
                    try {
                        const response = await fetch('/api/posts', {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.posts = await response.json();
                            this.filteredPosts = this.posts;
                            this.recentPosts = this.posts.slice(0, 5);
                        }
                    } catch (error) {
                        console.error('Failed to load posts:', error);
                    }
                },

                async loadApprovals() {
                    try {
                        const response = await fetch('/api/approvals/manager/' + this.user.id + '/pending', {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.pendingApprovals = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load approvals:', error);
                    }
                },

                async loadSchedules() {
                    try {
                        const response = await fetch('/api/schedules', {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.scheduledPosts = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load schedules:', error);
                    }
                },

                async loadNotifications() {
                    try {
                        const response = await fetch('/api/notifications/user/' + this.user.id, {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.notifications = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load notifications:', error);
                    }
                },

                async loadStats() {
                    try {
                        const [postsRes, approvalsRes] = await Promise.all([
                            fetch('/api/posts', {
                                headers: {
                                    'Authorization': 'Bearer ' + this.token
                                }
                            }),
                            fetch('/api/approvals/manager/' + this.user.id + '/pending/count', {
                                headers: {
                                    'Authorization': 'Bearer ' + this.token
                                }
                            })
                        ]);

                        if (postsRes.ok) {
                            const posts = await postsRes.json();
                            this.stats.totalPosts = posts.length;
                            this.stats.publishedPosts = posts.filter(p => p.currentStatus === 'PUBLISHED').length;
                        }

                        if (approvalsRes.ok) {
                            this.stats.pendingApprovals = await approvalsRes.json();
                        }
                    } catch (error) {
                        console.error('Failed to load stats:', error);
                    }
                },

                async login() {
                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.loginForm)
                        });

                        if (response.ok) {
                            const data = await response.json();
                            this.token = data.token;
                            this.user = data.user;
                            this.isAuthenticated = true;
                            localStorage.setItem('token', this.token);
                            this.showLogin = false;
                            this.loginForm = { email: '', password: '' };
                            this.loadData();
                        } else {
                            alert('Login failed');
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        alert('Login failed');
                    }
                },

                async register() {
                    try {
                        const response = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.registerForm)
                        });

                        if (response.ok) {
                            alert('Registration successful! Please login.');
                            this.showRegister = false;
                            this.registerForm = { email: '', password: '', department: '', role: 'USER' };
                        } else {
                            const error = await response.text();
                            alert('Registration failed: ' + error);
                        }
                    } catch (error) {
                        console.error('Registration error:', error);
                        alert('Registration failed');
                    }
                },

                async createPost() {
                    try {
                        // Debug logging
                        console.log('Creating post with data:', {
                            ...this.postForm,
                            createdBy: this.user?.id,
                            token: this.token ? 'present' : 'missing',
                            user: this.user ? 'present' : 'missing'
                        });

                        // Validation
                        if (!this.token) {
                            alert('Please log in to create a post');
                            return;
                        }

                        if (!this.user || !this.user.id) {
                            alert('User data not loaded. Please refresh and try again.');
                            return;
                        }

                        if (!this.postForm.title || !this.postForm.sourceDiscussion) {
                            alert('Please fill in all required fields');
                            return;
                        }

                        const response = await fetch('/api/posts', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + this.token
                            },
                            body: JSON.stringify({
                                title: this.postForm.title,
                                sourceDiscussion: this.postForm.sourceDiscussion,
                                targetPlatforms: this.postForm.targetPlatforms,
                                createdBy: this.user.id
                            })
                        });

                        console.log('Response status:', response.status);
                        
                        if (response.ok) {
                            const createdPost = await response.json();
                            console.log('Post created successfully:', createdPost);
                            
                            this.showCreatePost = false;
                            this.postForm = { title: '', sourceDiscussion: '', targetPlatforms: 'linkedin' };
                            await this.loadPosts();
                            await this.loadStats();
                            
                            // Show success message
                            alert('Post created successfully!');
                        } else {
                            const errorText = await response.text();
                            console.error('Failed to create post:', response.status, errorText);
                            alert(`Failed to create post: ${response.status} - ${errorText}`);
                        }
                    } catch (error) {
                        console.error('Create post error:', error);
                        alert(`Failed to create post: ${error.message}`);
                    }
                },

                async submitForApproval(postId) {
                    try {
                        const response = await fetch(`/api/posts/${postId}/submit-approval`, {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadPosts();
                        } else {
                            alert('Failed to submit for approval');
                        }
                    } catch (error) {
                        console.error('Submit for approval error:', error);
                        alert('Failed to submit for approval');
                    }
                },

                async approvePost(postId) {
                    try {
                        const response = await fetch(`/api/posts/${postId}/approve`, {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadApprovals();
                            this.loadPosts();
                        } else {
                            alert('Failed to approve post');
                        }
                    } catch (error) {
                        console.error('Approve post error:', error);
                        alert('Failed to approve post');
                    }
                },

                async rejectPost(postId, feedback) {
                    try {
                        const response = await fetch(`/api/posts/${postId}/reject?feedback=${encodeURIComponent(feedback)}`, {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadApprovals();
                            this.loadPosts();
                        } else {
                            alert('Failed to reject post');
                        }
                    } catch (error) {
                        console.error('Reject post error:', error);
                        alert('Failed to reject post');
                    }
                },

                async markAsRead(notificationId) {
                    try {
                        const response = await fetch(`/api/notifications/${notificationId}/read`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadNotifications();
                        }
                    } catch (error) {
                        console.error('Mark as read error:', error);
                    }
                },

                async markAllAsRead() {
                    try {
                        const response = await fetch(`/api/notifications/user/${this.user.id}/read-all`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadNotifications();
                        }
                    } catch (error) {
                        console.error('Mark all as read error:', error);
                    }
                },

                logout() {
                    this.isAuthenticated = false;
                    this.user = null;
                    this.token = null;
                    localStorage.removeItem('token');
                    this.posts = [];
                    this.notifications = [];
                    this.pendingApprovals = [];
                    this.scheduledPosts = [];
                },

                getStatusColor(status) {
                    const colors = {
                        'DRAFT': 'bg-gray-100 text-gray-800',
                        'PENDING_APPROVAL': 'bg-yellow-100 text-yellow-800',
                        'APPROVED': 'bg-green-100 text-green-800',
                        'REJECTED': 'bg-red-100 text-red-800',
                        'SCHEDULED': 'bg-blue-100 text-blue-800',
                        'PUBLISHED': 'bg-purple-100 text-purple-800'
                    };
                    return colors[status] || 'bg-gray-100 text-gray-800';
                },

                getScheduleStatusColor(status) {
                    const colors = {
                        'PENDING': 'bg-yellow-100 text-yellow-800',
                        'PUBLISHED': 'bg-green-100 text-green-800',
                        'FAILED': 'bg-red-100 text-red-800',
                        'CANCELLED': 'bg-gray-100 text-gray-800'
                    };
                    return colors[status] || 'bg-gray-100 text-gray-800';
                },

                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString();
                },

                formatDateTime(dateString) {
                    return new Date(dateString).toLocaleString();
                },

                viewPost(post) {
                    // Implementation for viewing post details
                    console.log('View post:', post);
                },

                editPost(post) {
                    // Implementation for editing post
                    console.log('Edit post:', post);
                },

                showRejectModal(approval) {
                    this.selectedApproval = approval;
                    this.showRejectModal = true;
                }
            }
        }
    </script>
