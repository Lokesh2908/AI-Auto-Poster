<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto Poster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" x-data="appData()">
        <!-- Navigation -->
        <nav class="bg-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-gray-800">AI Auto Poster</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <template x-if="!isAuthenticated">
                            <div class="flex space-x-2">
                                <button @click="showLogin = true" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                                    Login
                                </button>
                                <button @click="showRegister = true" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                                    Register
                                </button>
                            </div>
                        </template>
                        <template x-if="isAuthenticated">
                            <div class="flex items-center space-x-4">
                                <span class="text-gray-700" x-text="user.email"></span>
                                <button @click="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                                    Logout
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto py-6 px-4">
            <template x-if="!isAuthenticated">
                <div class="text-center py-12">
                    <h2 class="text-3xl font-bold text-gray-900 mb-4">Welcome to AI Auto Poster</h2>
                    <p class="text-lg text-gray-600 mb-8">Generate and schedule AI-powered LinkedIn posts with approval workflows</p>
                    <div class="space-x-4">
                        <button @click="showLogin = true" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600">
                            Get Started
                        </button>
                    </div>
                </div>
            </template>

            <template x-if="isAuthenticated">
                <div>
                    <!-- Dashboard Tabs -->
                    <div class="mb-6">
                        <nav class="flex space-x-8">
                            <button @click="activeTab = 'dashboard'" 
                                    :class="activeTab === 'dashboard' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500'"
                                    class="py-2 px-1 border-b-2 font-medium text-sm">
                                Dashboard
                            </button>
                            <button @click="activeTab = 'posts'" 
                                    :class="activeTab === 'posts' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500'"
                                    class="py-2 px-1 border-b-2 font-medium text-sm">
                                Posts
                            </button>
                            <button @click="activeTab = 'approvals'" 
                                    :class="activeTab === 'approvals' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500'"
                                    class="py-2 px-1 border-b-2 font-medium text-sm">
                                Approvals
                            </button>
                            <button @click="activeTab = 'schedule'" 
                                    :class="activeTab === 'schedule' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500'"
                                    class="py-2 px-1 border-b-2 font-medium text-sm">
                                Schedule
                            </button>
                            <button @click="activeTab = 'notifications'" 
                                    :class="activeTab === 'notifications' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500'"
                                    class="py-2 px-1 border-b-2 font-medium text-sm">
                                Notifications
                            </button>
                        </nav>
                    </div>

                    <!-- Dashboard Content -->
                    <div x-show="activeTab === 'dashboard'">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <div class="flex items-center">
                                    <div class="p-2 bg-blue-100 rounded-lg">
                                        <i class="fas fa-file-alt text-blue-600"></i>
                                    </div>
                                    <div class="ml-4">
                                        <p class="text-sm font-medium text-gray-500">Total Posts</p>
                                        <p class="text-2xl font-semibold text-gray-900" x-text="stats.totalPosts || 0"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <div class="flex items-center">
                                    <div class="p-2 bg-yellow-100 rounded-lg">
                                        <i class="fas fa-clock text-yellow-600"></i>
                                    </div>
                                    <div class="ml-4">
                                        <p class="text-sm font-medium text-gray-500">Pending Approvals</p>
                                        <p class="text-2xl font-semibold text-gray-900" x-text="stats.pendingApprovals || 0"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <div class="flex items-center">
                                    <div class="p-2 bg-green-100 rounded-lg">
                                        <i class="fas fa-check-circle text-green-600"></i>
                                    </div>
                                    <div class="ml-4">
                                        <p class="text-sm font-medium text-gray-500">Published</p>
                                        <p class="text-2xl font-semibold text-gray-900" x-text="stats.publishedPosts || 0"></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Recent Posts -->
                        <div class="bg-white rounded-lg shadow">
                            <div class="px-6 py-4 border-b border-gray-200">
                                <h3 class="text-lg font-medium text-gray-900">Recent Posts</h3>
                            </div>
                            <div class="p-6">
                                <div class="space-y-4">
                                    <template x-for="post in recentPosts" :key="post.id">
                                        <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg">
                                            <div>
                                                <h4 class="font-medium text-gray-900" x-text="post.title"></h4>
                                                <p class="text-sm text-gray-500" x-text="post.currentStatus"></p>
                                            </div>
                                            <span class="text-sm text-gray-500" x-text="formatDate(post.createdAt)"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Posts Tab -->
                    <div x-show="activeTab === 'posts'">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-gray-900">Posts</h2>
                            <button @click="showCreatePost = true" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                                Create New Post
                            </button>
                        </div>

                        <div class="bg-white rounded-lg shadow">
                            <div class="px-6 py-4 border-b border-gray-200">
                                <div class="flex space-x-4">
                                    <button @click="postFilter = 'all'" 
                                            :class="postFilter === 'all' ? 'bg-blue-100 text-blue-700' : 'text-gray-500'"
                                            class="px-3 py-1 rounded-full text-sm font-medium">
                                        All
                                    </button>
                                    <button @click="postFilter = 'draft'" 
                                            :class="postFilter === 'draft' ? 'bg-blue-100 text-blue-700' : 'text-gray-500'"
                                            class="px-3 py-1 rounded-full text-sm font-medium">
                                        Draft
                                    </button>
                                    <button @click="postFilter = 'pending_approval'" 
                                            :class="postFilter === 'pending_approval' ? 'bg-blue-100 text-blue-700' : 'text-gray-500'"
                                            class="px-3 py-1 rounded-full text-sm font-medium">
                                        Pending Approval
                                    </button>
                                    <button @click="postFilter = 'approved'" 
                                            :class="postFilter === 'approved' ? 'bg-blue-100 text-blue-700' : 'text-gray-500'"
                                            class="px-3 py-1 rounded-full text-sm font-medium">
                                        Approved
                                    </button>
                                </div>
                            </div>
                            <div class="p-6">
                                <div class="space-y-4">
                                    <template x-for="post in filteredPosts" :key="post.id">
                                        <div class="border border-gray-200 rounded-lg p-4">
                                            <div class="flex justify-between items-start">
                                                <div class="flex-1">
                                                    <h3 class="text-lg font-medium text-gray-900" x-text="post.title"></h3>
                                                    <p class="text-sm text-gray-500 mt-1" x-text="post.sourceDiscussion"></p>
                                                    <div class="flex items-center mt-2 space-x-4">
                                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                                              :class="getStatusColor(post.currentStatus)"
                                                              x-text="post.currentStatus"></span>
                                                        <span class="text-sm text-gray-500" x-text="formatDate(post.createdAt)"></span>
                                                    </div>
                                                </div>
                                                <div class="flex space-x-2">
                                                    <button @click="viewPost(post)" class="text-blue-600 hover:text-blue-800">
                                                        <i class="fas fa-eye"></i>
                                                    </button>
                                                    <button @click="editPost(post)" class="text-green-600 hover:text-green-800">
                                                        <i class="fas fa-edit"></i>
                                                    </button>
                                                    <template x-if="post.currentStatus === 'DRAFT'">
                                                        <button @click="submitForApproval(post.id)" class="text-yellow-600 hover:text-yellow-800">
                                                            <i class="fas fa-paper-plane"></i>
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Approvals Tab -->
                    <div x-show="activeTab === 'approvals'">
                        <div class="mb-6">
                            <h2 class="text-2xl font-bold text-gray-900">Approval Requests</h2>
                        </div>

                        <div class="bg-white rounded-lg shadow">
                            <div class="p-6">
                                <div class="space-y-4">
                                    <template x-for="approval in pendingApprovals" :key="approval.id">
                                        <div class="border border-gray-200 rounded-lg p-4">
                                            <div class="flex justify-between items-start">
                                                <div class="flex-1">
                                                    <h3 class="text-lg font-medium text-gray-900" x-text="approval.post.title"></h3>
                                                    <p class="text-sm text-gray-500 mt-1" x-text="approval.post.sourceDiscussion"></p>
                                                    <div class="flex items-center mt-2 space-x-4">
                                                        <span class="text-sm text-gray-500">Requested: <span x-text="formatDate(approval.createdAt)"></span></span>
                                                    </div>
                                                </div>
                                                <div class="flex space-x-2">
                                                    <button @click="approvePost(approval.post.id)" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                                                        Approve
                                                    </button>
                                                    <button @click="showRejectModal(approval)" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                                                        Reject
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Schedule Tab -->
                    <div x-show="activeTab === 'schedule'">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-gray-900">Scheduled Posts</h2>
                            <button @click="showScheduleModal = true" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                                Schedule Post
                            </button>
                        </div>

                        <div class="bg-white rounded-lg shadow">
                            <div class="p-6">
                                <div class="space-y-4">
                                    <template x-for="schedule in scheduledPosts" :key="schedule.id">
                                        <div class="border border-gray-200 rounded-lg p-4">
                                            <div class="flex justify-between items-start">
                                                <div class="flex-1">
                                                    <h3 class="text-lg font-medium text-gray-900" x-text="schedule.post.title"></h3>
                                                    <p class="text-sm text-gray-500 mt-1">Scheduled for: <span x-text="formatDateTime(schedule.scheduledFor)"></span></p>
                                                    <div class="flex items-center mt-2 space-x-4">
                                                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                                                              :class="getScheduleStatusColor(schedule.status)"
                                                              x-text="schedule.status"></span>
                                                    </div>
                                                </div>
                                                <div class="flex space-x-2">
                                                    <button @click="cancelSchedule(schedule.id)" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                                                        Cancel
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Notifications Tab -->
                    <div x-show="activeTab === 'notifications'">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-gray-900">Notifications</h2>
                            <button @click="markAllAsRead()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                                Mark All as Read
                            </button>
                        </div>

                        <div class="bg-white rounded-lg shadow">
                            <div class="p-6">
                                <div class="space-y-4">
                                    <template x-for="notification in notifications" :key="notification.id">
                                        <div class="border border-gray-200 rounded-lg p-4" 
                                             :class="notification.readStatus ? 'bg-gray-50' : 'bg-white'">
                                            <div class="flex justify-between items-start">
                                                <div class="flex-1">
                                                    <h3 class="text-lg font-medium text-gray-900" x-text="notification.type"></h3>
                                                    <p class="text-sm text-gray-500 mt-1" x-text="notification.message"></p>
                                                    <div class="flex items-center mt-2 space-x-4">
                                                        <span class="text-sm text-gray-500" x-text="formatDate(notification.createdAt)"></span>
                                                        <span x-if="!notification.readStatus" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                                            New
                                                        </span>
                                                    </div>
                                                </div>
                                                <div class="flex space-x-2">
                                                    <button @click="markAsRead(notification.id)" class="text-blue-600 hover:text-blue-800">
                                                        <i class="fas fa-check"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Login Modal -->
        <div x-show="showLogin" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" style="display: none;">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <div class="mt-3">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Login</h3>
                    <form @submit.prevent="login()">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" x-model="loginForm.email" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" x-model="loginForm.password" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="flex justify-end space-x-2">
                            <button type="button" @click="showLogin = false" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200">
                                Cancel
                            </button>
                            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700">
                                Login
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Register Modal -->
        <div x-show="showRegister" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" style="display: none;">
            <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
                <div class="mt-3">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Register</h3>
                    <form @submit.prevent="register()">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" x-model="registerForm.email" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" x-model="registerForm.password" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Department</label>
                            <input type="text" x-model="registerForm.department" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Role</label>
                            <select x-model="registerForm.role" required
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                <option value="USER">User</option>
                                <option value="MANAGER">Manager</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                        </div>
                        <div class="flex justify-end space-x-2">
                            <button type="button" @click="showRegister = false" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200">
                                Cancel
                            </button>
                            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-md hover:bg-green-700">
                                Register
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Create Post Modal -->
        <div x-show="showCreatePost" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" style="display: none;">
            <div class="relative top-20 mx-auto p-5 border w-2xl shadow-lg rounded-md bg-white">
                <div class="mt-3">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Create New Post</h3>
                    <form @submit.prevent="createPost()">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Title</label>
                            <input type="text" x-model="postForm.title" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Source Discussion</label>
                            <textarea x-model="postForm.sourceDiscussion" rows="4" required
                                      class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">Target Platforms</label>
                            <input type="text" x-model="postForm.targetPlatforms" value="linkedin"
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="flex justify-end space-x-2">
                            <button type="button" @click="showCreatePost = false" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200">
                                Cancel
                            </button>
                            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700">
                                Create Post
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function appData() {
            return {
                isAuthenticated: false,
                user: null,
                token: localStorage.getItem('token'),
                activeTab: 'dashboard',
                postFilter: 'all',
                showLogin: false,
                showRegister: false,
                showCreatePost: false,
                showScheduleModal: false,
                showRejectModal: false,
                stats: {
                    totalPosts: 0,
                    pendingApprovals: 0,
                    publishedPosts: 0
                },
                posts: [],
                recentPosts: [],
                filteredPosts: [],
                pendingApprovals: [],
                scheduledPosts: [],
                notifications: [],
                loginForm: {
                    email: '',
                    password: ''
                },
                registerForm: {
                    email: '',
                    password: '',
                    department: '',
                    role: 'USER'
                },
                postForm: {
                    title: '',
                    sourceDiscussion: '',
                    targetPlatforms: 'linkedin'
                },
                selectedApproval: null,
                rejectFeedback: '',

                init() {
                    if (this.token) {
                        this.validateToken();
                    }
                    this.loadData();
                },

                async validateToken() {
                    try {
                        const response = await fetch('/api/auth/validate?token=' + this.token);
                        if (response.ok) {
                            this.isAuthenticated = true;
                            this.loadUserData();
                        } else {
                            this.logout();
                        }
                    } catch (error) {
                        console.error('Token validation failed:', error);
                        this.logout();
                    }
                },

                async loadUserData() {
                    try {
                        const response = await fetch('/api/users/email/' + this.loginForm.email, {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.user = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load user data:', error);
                    }
                },

                async loadData() {
                    if (!this.isAuthenticated) return;
                    
                    await Promise.all([
                        this.loadPosts(),
                        this.loadApprovals(),
                        this.loadSchedules(),
                        this.loadNotifications(),
                        this.loadStats()
                    ]);
                },

                async loadPosts() {
                    try {
                        const response = await fetch('/api/posts', {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.posts = await response.json();
                            this.filteredPosts = this.posts;
                            this.recentPosts = this.posts.slice(0, 5);
                        }
                    } catch (error) {
                        console.error('Failed to load posts:', error);
                    }
                },

                async loadApprovals() {
                    try {
                        const response = await fetch('/api/approvals/manager/' + this.user.id + '/pending', {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.pendingApprovals = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load approvals:', error);
                    }
                },

                async loadSchedules() {
                    try {
                        const response = await fetch('/api/schedules', {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.scheduledPosts = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load schedules:', error);
                    }
                },

                async loadNotifications() {
                    try {
                        const response = await fetch('/api/notifications/user/' + this.user.id, {
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });
                        if (response.ok) {
                            this.notifications = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load notifications:', error);
                    }
                },

                async loadStats() {
                    try {
                        const [postsRes, approvalsRes] = await Promise.all([
                            fetch('/api/posts', {
                                headers: {
                                    'Authorization': 'Bearer ' + this.token
                                }
                            }),
                            fetch('/api/approvals/manager/' + this.user.id + '/pending/count', {
                                headers: {
                                    'Authorization': 'Bearer ' + this.token
                                }
                            })
                        ]);

                        if (postsRes.ok) {
                            const posts = await postsRes.json();
                            this.stats.totalPosts = posts.length;
                            this.stats.publishedPosts = posts.filter(p => p.currentStatus === 'PUBLISHED').length;
                        }

                        if (approvalsRes.ok) {
                            this.stats.pendingApprovals = await approvalsRes.json();
                        }
                    } catch (error) {
                        console.error('Failed to load stats:', error);
                    }
                },

                async login() {
                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.loginForm)
                        });

                        if (response.ok) {
                            const data = await response.json();
                            this.token = data.token;
                            this.user = data.user;
                            this.isAuthenticated = true;
                            localStorage.setItem('token', this.token);
                            this.showLogin = false;
                            this.loginForm = { email: '', password: '' };
                            this.loadData();
                        } else {
                            alert('Login failed');
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        alert('Login failed');
                    }
                },

                async register() {
                    try {
                        const response = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(this.registerForm)
                        });

                        if (response.ok) {
                            alert('Registration successful! Please login.');
                            this.showRegister = false;
                            this.registerForm = { email: '', password: '', department: '', role: 'USER' };
                        } else {
                            const error = await response.text();
                            alert('Registration failed: ' + error);
                        }
                    } catch (error) {
                        console.error('Registration error:', error);
                        alert('Registration failed');
                    }
                },

                async createPost() {
                    try {
                        const response = await fetch('/api/posts', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + this.token
                            },
                            body: JSON.stringify({
                                ...this.postForm,
                                createdBy: this.user.id
                            })
                        });

                        if (response.ok) {
                            this.showCreatePost = false;
                            this.postForm = { title: '', sourceDiscussion: '', targetPlatforms: 'linkedin' };
                            this.loadPosts();
                        } else {
                            alert('Failed to create post');
                        }
                    } catch (error) {
                        console.error('Create post error:', error);
                        alert('Failed to create post');
                    }
                },

                async submitForApproval(postId) {
                    try {
                        const response = await fetch(`/api/posts/${postId}/submit-approval`, {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadPosts();
                        } else {
                            alert('Failed to submit for approval');
                        }
                    } catch (error) {
                        console.error('Submit for approval error:', error);
                        alert('Failed to submit for approval');
                    }
                },

                async approvePost(postId) {
                    try {
                        const response = await fetch(`/api/posts/${postId}/approve`, {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadApprovals();
                            this.loadPosts();
                        } else {
                            alert('Failed to approve post');
                        }
                    } catch (error) {
                        console.error('Approve post error:', error);
                        alert('Failed to approve post');
                    }
                },

                async rejectPost(postId, feedback) {
                    try {
                        const response = await fetch(`/api/posts/${postId}/reject?feedback=${encodeURIComponent(feedback)}`, {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadApprovals();
                            this.loadPosts();
                        } else {
                            alert('Failed to reject post');
                        }
                    } catch (error) {
                        console.error('Reject post error:', error);
                        alert('Failed to reject post');
                    }
                },

                async markAsRead(notificationId) {
                    try {
                        const response = await fetch(`/api/notifications/${notificationId}/read`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadNotifications();
                        }
                    } catch (error) {
                        console.error('Mark as read error:', error);
                    }
                },

                async markAllAsRead() {
                    try {
                        const response = await fetch(`/api/notifications/user/${this.user.id}/read-all`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': 'Bearer ' + this.token
                            }
                        });

                        if (response.ok) {
                            this.loadNotifications();
                        }
                    } catch (error) {
                        console.error('Mark all as read error:', error);
                    }
                },

                logout() {
                    this.isAuthenticated = false;
                    this.user = null;
                    this.token = null;
                    localStorage.removeItem('token');
                    this.posts = [];
                    this.notifications = [];
                    this.pendingApprovals = [];
                    this.scheduledPosts = [];
                },

                getStatusColor(status) {
                    const colors = {
                        'DRAFT': 'bg-gray-100 text-gray-800',
                        'PENDING_APPROVAL': 'bg-yellow-100 text-yellow-800',
                        'APPROVED': 'bg-green-100 text-green-800',
                        'REJECTED': 'bg-red-100 text-red-800',
                        'SCHEDULED': 'bg-blue-100 text-blue-800',
                        'PUBLISHED': 'bg-purple-100 text-purple-800'
                    };
                    return colors[status] || 'bg-gray-100 text-gray-800';
                },

                getScheduleStatusColor(status) {
                    const colors = {
                        'PENDING': 'bg-yellow-100 text-yellow-800',
                        'PUBLISHED': 'bg-green-100 text-green-800',
                        'FAILED': 'bg-red-100 text-red-800',
                        'CANCELLED': 'bg-gray-100 text-gray-800'
                    };
                    return colors[status] || 'bg-gray-100 text-gray-800';
                },

                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString();
                },

                formatDateTime(dateString) {
                    return new Date(dateString).toLocaleString();
                },

                viewPost(post) {
                    // Implementation for viewing post details
                    console.log('View post:', post);
                },

                editPost(post) {
                    // Implementation for editing post
                    console.log('Edit post:', post);
                },

                showRejectModal(approval) {
                    this.selectedApproval = approval;
                    this.showRejectModal = true;
                }
            }
        }
    </script>
</body>
